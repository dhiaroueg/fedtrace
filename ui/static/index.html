<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FedTrace Console</title>
<style>
:root{--bg:#0a0f1f;--bg2:#0e1530;--panel:#121b36;--panel2:#18234a;--line:#26345f;--text:#e8edff;--muted:#93a0c8;--accent:#6ea8ff;--accent2:#9b7bff;--ok:#3ddc97;--bad:#ff5d73;--warn:#ffc857;--shadow:0 10px 30px rgba(0,0,0,.35)}
:root[data-theme=light]{--bg:#f3f5fb;--bg2:#e9edf8;--panel:#fff;--panel2:#f1f4fc;--line:#d6ddf0;--text:#16213e;--muted:#5d6b92;--accent:#2f6bff;--accent2:#7a4dff;--ok:#0f9d63;--bad:#d62f48;--warn:#b7800a;--shadow:0 8px 24px rgba(30,50,110,.12)}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 600px at 10% -10%,var(--bg2),var(--bg));color:var(--text);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
code,.mono{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);z-index:20}
.logo{font-weight:800;font-size:18px;letter-spacing:.3px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:12px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}.bad .dot{background:var(--bad);box-shadow:0 0 8px var(--bad)}.warn .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 13px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--accent);transform:translateY(-1px)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;font-weight:600}
button.danger{border-color:color-mix(in srgb,var(--bad) 60%,var(--line));color:var(--bad)}
button:disabled{opacity:.5;cursor:wait;transform:none}
select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12px}
nav{display:flex;gap:6px;padding:12px 22px 0;overflow-x:auto}
nav button{border-radius:10px 10px 0 0;border-bottom:0;background:transparent;color:var(--muted)}
nav button.active{background:var(--panel);color:var(--text);border-color:var(--line);box-shadow:inset 0 2px 0 var(--accent)}
main{padding:0 22px 40px}
.tab{display:none;background:var(--panel);border:1px solid var(--line);border-radius:0 14px 14px 14px;padding:20px;box-shadow:var(--shadow);animation:fade .25s}
.tab.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
h2{margin:0 0 4px;font-size:18px}h3{margin:18px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lead{color:var(--muted);margin:0 0 16px;max-width:820px}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:26px;font-weight:750}.kpi .l{color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600;font-size:12px}
tr.click{cursor:pointer}tr.click:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;margin:1px 3px 1px 0;border:1px solid var(--line)}
.chip.k{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}.chip.r{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,var(--line));font-weight:600}
.banner{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));color:var(--warn);padding:6px 12px;border-radius:10px;font-size:12px}
.note{color:var(--muted);font-size:12px}
svg text{fill:var(--muted);font-size:11px}
.blocks{display:flex;flex-direction:column;gap:0;max-height:520px;overflow:auto;padding-right:6px}
.blk{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;margin:0;position:relative}
.blk+.blk{margin-top:14px}.blk+.blk::before{content:"";position:absolute;left:23px;top:-14px;height:14px;width:2px;background:var(--accent)}
.blk.brk{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel2))}.blk.brk::before{background:var(--bad)}
.blk.sel{outline:2px solid var(--accent)}
.idx{min-width:34px;height:26px;border-radius:7px;background:var(--panel);display:grid;place-items:center;font-weight:700;font-size:12px}
.op{font-size:11px;padding:1px 8px;border-radius:6px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.op.AnchorContribution{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.op.AnchorDecision{background:color-mix(in srgb,var(--accent2) 20%,transparent);color:var(--accent2)}.op.RevokeModel{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;max-height:420px;margin:0;font-size:12px}
.tree{display:flex;flex-direction:column;align-items:center;gap:0}
.node{width:min(720px,100%);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
.node:hover,.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.node.dec{border-color:var(--accent2)}.node h4{margin:0 0 4px;font-size:14px}
.link{width:2px;height:22px;background:linear-gradient(var(--accent),var(--accent2));position:relative}
.link::after{content:"▲";position:absolute;left:-5px;top:-3px;font-size:9px;color:var(--accent)}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0}.bar .n{width:34px;color:var(--muted);font-size:12px}.bar .t{flex:1;height:14px;background:var(--bg);border-radius:7px;position:relative;overflow:hidden}
.bar .t i{position:absolute;top:0;bottom:0;border-radius:7px}.bar .t u{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}.bar .x{width:62px;text-align:right;font-size:12px}
.result{border-radius:12px;padding:14px;border:1px solid var(--line);margin-top:12px}
.result.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}.result.refuse{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.gauge{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin:6px 0}.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad))}
.sc{display:flex;flex-direction:column;gap:10px}.sc h4{margin:0}
.console{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12px;max-height:300px;overflow:auto}
.console div{margin:2px 0}.console .ok::before{content:"✔ ";color:var(--ok)}.console .bad::before{content:"✘ ";color:var(--bad)}.console .info::before{content:"› ";color:var(--muted)}
.console .ok{color:var(--text)}.console .bad{color:var(--bad)}.console .info{color:var(--muted)}
.verdict{font-weight:700;margin-top:6px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:360px;z-index:50;animation:fade .2s}
.toast.err{border-left-color:var(--bad)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
@media(max-width:640px){header{padding:10px 14px}main{padding:0 12px 30px}nav{padding:10px 12px 0}.tab{padding:14px}}
</style>
</head>
<body>
<header>
  <div><div class="logo">FedTrace Console</div><div class="sub">Provenance auditable d'un apprentissage fédéré</div></div>
  <div class="spacer"></div>
  <span class="pill" id="pChain"><span class="dot"></span><span>chaîne</span></span>
  <span class="pill" id="pLedger"><span class="dot"></span><span>registre</span></span>
  <span class="pill" id="pPending"><span class="dot"></span><span>file</span></span>
  <button id="theme" title="Changer de thème">Thème</button>
</header>
<nav id="nav"></nav>
<main>
 <section class="tab" id="t-dashboard"></section>
 <section class="tab" id="t-fed"></section>
 <section class="tab" id="t-ledger"></section>
 <section class="tab" id="t-prov"></section>
 <section class="tab" id="t-diag"></section>
 <section class="tab" id="t-sc"></section>
 <section class="tab" id="t-bench"></section>
</main>
<script>
const TABS=[["dashboard","Tableau de bord"],["fed","Fédération"],["ledger","Registre"],["prov","Provenance"],["diag","Diagnostic"],["sc","Scénarios"],["bench","Mesures"]];
let S=null,tab="dashboard",selBlock=null,provSel=null,provData=null,provId="",diagState={result:null,verify:null,tampered:false},scLogs={},busy=false,BENCH=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sh=(h,n=12)=>h?`<code>${esc(h.slice(0,n))}…</code>`:"—";
function toast(m,err){const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4200)}
async function api(path,body){
  const r=await fetch(path,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
async function act(btn,fn){if(busy)return;busy=true;const old=btn&&btn.innerHTML;if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> '+btn.textContent}
  try{await fn()}catch(e){toast(e.message,true)}finally{busy=false;if(btn){btn.disabled=false;btn.innerHTML=old}}}
async function refresh(){S=await api("/api/state");render()}

/* ---------- navigation ---------- */
$("#nav").innerHTML=TABS.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join("");
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.t;render()}};
$("#theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light";try{localStorage.ft_theme=r.dataset.theme}catch(e){}render()};
try{if(localStorage.ft_theme)document.documentElement.dataset.theme=localStorage.ft_theme}catch(e){}

function render(){
  if(!S||!S.ready)return;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.t===tab));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.id==="t-"+tab));
  const set=(id,cls,txt)=>{const e=$(id);e.className="pill "+cls;e.lastElementChild.textContent=txt};
  set("#pChain",S.chain_ok?"ok":"bad",S.chain_ok?"chaîne valide":`chaîne rompue (bloc ${S.first_bad})`);
  set("#pLedger",S.available?"ok":"bad",S.available?"registre en ligne":"registre hors ligne");
  set("#pPending",S.pending?"warn":"ok",`${S.pending} en file`);
  ({dashboard:rDash,fed:rFed,ledger:rLedger,prov:rProv,diag:rDiag,sc:rSc,bench:rBench})[tab]();
}

/* ---------- graphiques SVG ---------- */
function lineChart(pts,{w=560,h=230,ymin=0,ymax=1,fmt=v=>v.toFixed(2)}={}){
  const p={l:42,r:14,t:14,b:28},iw=w-p.l-p.r,ih=h-p.t-p.b,n=pts.length;
  const X=i=>p.l+(n<2?iw/2:i*iw/(n-1)),Y=v=>p.t+ih-(v-ymin)/(ymax-ymin)*ih;
  let g="";for(let k=0;k<=4;k++){const v=ymin+(ymax-ymin)*k/4,y=Y(v);g+=`<line x1="${p.l}" x2="${w-p.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${p.l-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}
  const d=pts.map((q,i)=>`${i?"L":"M"}${X(i)},${Y(q.y)}`).join(" ");
  const area=`${d} L${X(n-1)},${Y(ymin)} L${X(0)},${Y(ymin)} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${g}
  <path d="${area}" fill="url(#ga)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  ${pts.map((q,i)=>`<circle cx="${X(i)}" cy="${Y(q.y)}" r="${q.bad?6:4}" fill="${q.bad?"var(--bad)":"var(--accent)"}"><title>${esc(q.t)}</title></circle><text x="${X(i)}" y="${h-8}" text-anchor="middle">${q.x}</text>`).join("")}</svg>`}
function barChart(items,{w=560,h=220,fmt=v=>v,color="var(--accent)"}={}){
  const p={l:46,r:10,t:12,b:34},iw=w-p.l-p.r,ih=h-p.t-p.b,max=Math.max(...items.map(i=>i.v),1e-9),bw=iw/items.length*.62;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${[0,.5,1].map(k=>`<line x1="${p.l}" x2="${w-p.r}" y1="${p.t+ih*(1-k)}" y2="${p.t+ih*(1-k)}" stroke="var(--line)"/><text x="${p.l-6}" y="${p.t+ih*(1-k)+4}" text-anchor="end">${fmt(max*k)}</text>`).join("")}
  ${items.map((it,i)=>{const x=p.l+i*iw/items.length+(iw/items.length-bw)/2,bh=it.v/max*ih;return `<rect x="${x}" y="${p.t+ih-bh}" width="${bw}" height="${bh}" rx="5" fill="${it.c||color}"><title>${esc(it.t||"")}</title></rect><text x="${x+bw/2}" y="${h-18}" text-anchor="middle">${esc(it.l)}</text>${it.l2?`<text x="${x+bw/2}" y="${h-6}" text-anchor="middle">${esc(it.l2)}</text>`:""}`}).join("")}</svg>`}

/* ---------- tableau de bord ---------- */
function rDash(){
  const H=S.history,last=H[H.length-1],rej=H.reduce((a,h)=>a+h.rejected.length,0);
  const pts=H.map(h=>({x:h.round,y:h.accuracy,bad:h.rejected.length>0,t:`Round ${h.round} — précision ${h.accuracy.toFixed(3)}${h.rejected.length?" — rejet : "+h.rejected.map(r=>r.clinic).join(", "):""}`}));
  $("#t-dashboard").innerHTML=`
  <h2>Tableau de bord</h2><p class="lead">Vue d'ensemble de la fédération en cours : ce qui a été entraîné, ce qui a été inscrit au registre et ce qui a été écarté.</p>
  <div class="banner" style="margin-bottom:14px">Prototype pédagogique — données synthétiques, registre local simplifié (substitut de Hyperledger Fabric).</div>
  <div class="grid kpis">
   ${[["Cliniques",S.cfg.clinics],["Rounds",S.cfg.rounds],["Précision finale",last.accuracy.toFixed(3)],["Blocs inscrits",S.blocks.length],["Octets écrits",S.bytes_written.toLocaleString("fr-FR")],["Contributions écartées",rej],["Décisions",S.decisions.length]].map(([l,v])=>`<div class="card kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}
  </div>
  <div class="grid two" style="margin-top:14px">
   <div class="card"><h3 style="margin-top:0">Précision du modèle global par round</h3>${lineChart(pts)}<div class="legend"><span><i style="background:var(--accent)"></i>round normal</span><span><i style="background:var(--bad)"></i>round avec contribution écartée</span></div></div>
   <div class="card"><h3 style="margin-top:0">Configuration</h3><table><tr><td>Stratégie</td><td><b>${esc(S.cfg.strategy)}</b></td></tr><tr><td>Ancrage</td><td><b>${{A:"A — aucun",B:"B — modèles",C:"C — contributions + modèles"}[S.cfg.config]}</b></td></tr><tr><td>Clinique malveillante</td><td><b>${S.cfg.attacker?"oui ("+esc(S.names[S.names.length-1])+")":"non"}</b></td></tr><tr><td>Modèle courant</td><td>${sh(S.latest,20)}</td></tr><tr><td>Modèles révoqués</td><td>${S.revoked.length?S.revoked.map(r=>sh(r)).join(" "):"aucun"}</td></tr></table></div>
  </div>
  <h3>Rounds (cliquer pour la provenance)</h3>
  <div style="overflow:auto"><table><thead><tr><th>Round</th><th>Empreinte du modèle</th><th>Précision</th><th>Cliniques retenues</th><th>Écartées</th></tr></thead><tbody>
  ${H.slice().reverse().map(h=>`<tr class="click" data-fp="${h.fingerprint}"><td><b>${h.round}</b></td><td>${sh(h.fingerprint,16)}</td><td>${h.accuracy.toFixed(3)}</td><td>${h.kept.map(k=>`<span class="chip k">${esc(k)}</span>`).join("")||'<span class="note">—</span>'}</td><td>${h.rejected.map(r=>`<span class="chip r" title="${esc(r.reason)} — score ${r.score.toExponential(2)}">${esc(r.clinic)}</span>`).join("")||'<span class="note">—</span>'}</td></tr>`).join("")}
  </tbody></table></div>`;
  document.querySelectorAll("#t-dashboard tr.click").forEach(tr=>tr.onclick=()=>openModelProv(tr.dataset.fp));
}
async function openModelProv(fp){try{provId="";provData=await api("/api/provenance?model="+fp);provSel=null;tab="prov";render()}catch(e){toast(e.message,true)}}

/* ---------- fédération ---------- */
function rFed(){
  const c=S.cfg;
  $("#t-fed").innerHTML=`<h2>Lancer une fédération</h2><p class="lead">Configurez et relancez l'expérience. Choisissez la stratégie d'agrégation, ajoutez une clinique malveillante, ou désactivez l'ancrage pour comparer les trois configurations du sujet.</p>
  <div class="card"><div class="row">
   <label>Cliniques<input id="fN" type="number" min="3" max="7" value="${c.clinics}" style="width:90px"></label>
   <label>Rounds<input id="fR" type="number" min="1" max="15" value="${c.rounds}" style="width:90px"></label>
   <label>Agrégation<select id="fS"><option value="fedavg">Moyenne pondérée</option><option value="multikrum">Multi-Krum (robuste)</option></select></label>
   <label>Ancrage<select id="fC"><option value="C">C — contributions + modèles</option><option value="B">B — modèles seulement</option><option value="A">A — aucun (fédération seule)</option></select></label>
   <label style="flex-direction:row;align-items:center;gap:8px;color:var(--text)"><input id="fA" type="checkbox" ${c.attacker?"checked":""}> Clinique malveillante (dernière)</label>
   <button class="primary" id="fGo">Lancer</button></div>
   <p class="note" style="margin:12px 0 0">Multi-Krum exige n ≥ 2f+3 : avec f = 1, il faut au moins 5 cliniques pour tolérer une clinique malveillante. En configuration A, rien n'est inscrit : la porte de certification refusera tout diagnostic.</p></div>`;
  $("#fS").value=c.strategy;$("#fC").value=c.config;
  $("#fGo").onclick=e=>act(e.currentTarget,async()=>{S=await api("/api/run",{clinics:+$("#fN").value,rounds:+$("#fR").value,strategy:$("#fS").value,config:$("#fC").value,attacker:$("#fA").checked});diagState={result:null,verify:null,tampered:false};provData=null;provSel=null;selBlock=null;tab="dashboard";render();toast("Fédération terminée.")});
}

/* ---------- registre ---------- */
function rLedger(){
  const B=S.blocks;
  $("#t-ledger").innerHTML=`<h2>Registre</h2><p class="lead">Chaque bloc contient l'empreinte du précédent : modifier un ancien bloc casse toute la suite. Altérez un bloc pour voir la rupture, ou coupez le registre pour observer la file de reprise.</p>
  <div class="row" style="margin-bottom:12px">
   <button id="lVer">Vérifier la chaîne</button><button class="danger" id="lTam">Altérer un bloc</button><button id="lRes">Restaurer</button>
   <span style="width:12px"></span>
   <button class="${S.available?"danger":""}" id="lOut">${S.available?"Couper le registre":"Rallumer le registre"}</button><button id="lFlush">Rejouer la file (${S.pending})</button>
   <button class="danger" id="lRev" title="Révoque le modèle courant">Révoquer le modèle courant</button></div>
  <div class="grid two"><div><div class="blocks" id="bl">${B.map(b=>{const brk=S.first_bad!==null&&b.index>=S.first_bad;return `<div class="blk ${brk?"brk":""} ${selBlock===b.index?"sel":""}" data-i="${b.index}"><div class="idx">${b.index}</div><div style="flex:1;min-width:0"><span class="op ${b.op}">${b.op}</span> <span class="note">par ${esc(b.identity)}</span><div class="mono" style="color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.keys.join(", "))}</div></div><code title="hachage">${b.hash.slice(0,8)}</code></div>`}).join("")}</div></div>
  <div><h3 style="margin-top:0">Détail du bloc</h3><pre id="bd">Sélectionnez un bloc.</pre><p class="note" id="bn"></p></div></div>`;
  $("#bl").onclick=async e=>{const b=e.target.closest(".blk");if(!b)return;selBlock=+b.dataset.i;try{const j=await api("/api/block?i="+selBlock);$("#bd").textContent=JSON.stringify(j,null,2);$("#bn").textContent=S.first_bad!==null&&selBlock>=S.first_bad?"Ce bloc ne correspond plus à son hachage ou à celui de son prédécesseur.":""}catch(er){toast(er.message,true)}document.querySelectorAll(".blk").forEach(x=>x.classList.toggle("sel",+x.dataset.i===selBlock))};
  const post=(id,path,body,msg)=>{$(id).onclick=e=>act(e.currentTarget,async()=>{S=await api(path,body??{});render();if(msg)toast(typeof msg==="function"?msg():msg)})};
  $("#lVer").onclick=()=>toast(S.chain_ok?"Chaîne valide : tous les hachages concordent.":`Chaîne ROMPUE à partir du bloc ${S.first_bad}.`,!S.chain_ok);
  post("#lTam","/api/ledger/tamper",{},"Bloc altéré : voyez la rupture.");post("#lRes","/api/ledger/restore",{},"Chaîne restaurée.");
  $("#lOut").onclick=e=>act(e.currentTarget,async()=>{S=await api("/api/outage",{down:S.available});render()});
  post("#lFlush","/api/flush",{},()=>S.pending?"Registre injoignable : écritures toujours en file.":"File rejouée sans perte ni doublon.");
  $("#lRev").onclick=e=>act(e.currentTarget,async()=>{S=await api("/api/revoke",{});render();toast("Modèle révoqué : la porte refusera désormais les diagnostics.")});
}

/* ---------- provenance ---------- */
async function loadProv(id){try{provId=id;provData=await api("/api/provenance?decision="+id);provSel=null;render()}catch(e){toast(e.message,true)}}
function rProv(){
  const opts=S.decisions.map(d=>`<option>${d}</option>`).join("");
  let body='<p class="note">Aucune provenance chargée : produisez un diagnostic (onglet Diagnostic) ou cliquez sur un round du tableau de bord.</p>';
  if(provData){
    const nodes=[];let n=provData.model,i=0;
    const dec=provData.decision;
    let html='<div class="tree">';
    if(dec){html+=`<div class="node dec" data-k="d"><h4>Décision <code>${esc(dec.decision_id)}</code> — ${esc(dec.clinic)}</h4><div class="note">cas ${esc(dec.case)} · probabilité ${dec.probability} · tx ${sh(provData.txid,10)}</div></div><div class="link"></div>`}
    while(n){const k="m"+i;nodes.push([k,n]);
      html+=`<div class="node ${provSel===k?"sel":""}" data-k="${k}"><h4>Round ${n.round} — modèle ${sh(n.fingerprint,14)}</h4><div class="note">${esc(n.strategy)} · précision ${(n.metrics.accuracy??0).toFixed(3)} · tx ${sh(n.txid,10)}</div><div style="margin-top:6px">${n.contributions.map(c=>`<span class="chip ${c.status==="kept"?"k":"r"}" title="${c.status==="kept"?"retenue":"écartée : "+esc(c.reason)+" (score "+(+c.score).toExponential(2)+")"}">${esc(c.clinic)} ${c.status==="kept"?"✔":"✘ écartée"}</span>`).join("")||'<span class="note">modèle initial (genèse)</span>'}</div></div>`;
      n=n.parent;i++;if(n)html+='<div class="link"></div>'}
    html+="</div>";
    const detail=provSel==="d"?dec:(nodes.find(x=>x[0]===provSel)||[])[1];
    body=`<div class="grid two"><div>${html}</div><div><h3 style="margin-top:0">Détail</h3><pre>${detail?esc(JSON.stringify(detail,(k,v)=>k==="parent"?undefined:v,2)):"Cliquez sur un nœud."}</pre><p class="note">Lecture : du diagnostic vers le haut, chaque flèche pointe vers le modèle parent. Les cliniques en rouge ont été écartées de l'agrégation et ce rejet est lui-même ancré.</p></div></div>`;
    window._nodes=nodes;
  }
  $("#t-prov").innerHTML=`<h2>Arbre de provenance</h2><p class="lead">Du diagnostic jusqu'au modèle initial, avec les cliniques contributrices de chaque round.</p>
  <div class="row" style="margin-bottom:14px"><label>Décision<select id="pD"><option value="">—</option>${opts}</select></label></div>${body}`;
  $("#pD").value=provId;$("#pD").onchange=e=>e.target.value&&loadProv(e.target.value);
  document.querySelectorAll("#t-prov .node").forEach(el=>el.onclick=()=>{provSel=el.dataset.k;render()});
}

/* ---------- diagnostic ---------- */
function rDiag(){
  const R=diagState.result;
  let out="";
  if(R){
    if(R.refused){out=`<div class="result refuse"><h3 style="margin:0 0 6px;color:var(--bad)">✘ Diagnostic refusé par la porte de certification</h3><div>${esc(R.reason)}</div><p class="note">Rien n'a été ancré. Le modèle chargé n'a aucun round correspondant dans le registre.</p></div>`}
    else{const d=R.decision,ex=R.explanation,cs=Object.entries(ex.contributions),m=Math.max(...cs.map(([,v])=>Math.abs(v)),1e-9);
      out=`<div class="result good"><h3 style="margin:0 0 6px;color:var(--ok)">✔ Modèle certifié — diagnostic produit</h3>
      <div class="grid two"><div><div class="note">Probabilité</div><div style="font-size:26px;font-weight:750">${(d.probability*100).toFixed(1)} %</div><div class="gauge"><i style="width:${d.probability*100}%"></i></div>
      <table><tr><td>Cas (pseudonyme)</td><td><code>${esc(d.case)}</code></td></tr><tr><td>Modèle</td><td>${sh(d.model_fp,16)}</td></tr><tr><td>Explication</td><td>${sh(d.explanation_fp,16)}</td></tr><tr><td>Transaction</td><td>${R.txid?sh(R.txid,16):'<span class="warn">en file (registre indisponible)</span>'}</td></tr></table></div>
      <div><div class="note">Contribution de chaque caractéristique à la décision</div>${cs.map(([k,v])=>`<div class="bar"><span class="n">${k}</span><span class="t"><u></u><i style="${v>=0?`left:50%;width:${Math.abs(v)/m*50}%;background:var(--ok)`:`right:50%;width:${Math.abs(v)/m*50}%;background:var(--bad)`}"></i></span><span class="x">${v.toFixed(3)}</span></div>`).join("")}</div></div>
      <div class="row" style="margin-top:12px"><button id="dVer">Vérifier l'intégrité de l'explication</button><button class="danger" id="dTam">Falsifier l'explication stockée</button><button id="dRes">Restaurer l'original</button><button id="dProv">Voir la provenance →</button></div>
      ${diagState.verify?`<div class="result ${diagState.verify.ok?"good":"refuse"}" style="margin-top:12px"><b>${diagState.verify.ok?"✔ Explication intègre":"✘ FALSIFICATION DÉTECTÉE : "+esc(diagState.verify.reason)}</b><div class="mono" style="margin-top:6px">ancrée : ${esc(diagState.verify.anchored)}<br>actuelle : ${esc(diagState.verify.actual)}</div></div>`:""}</div>`}
  }
  $("#t-diag").innerHTML=`<h2>Diagnostic</h2><p class="lead">Avant tout diagnostic, la porte recalcule l'empreinte du modèle chargé et interroge le registre. Essayez avec un modèle entraîné hors fédération, après avoir coupé le registre ou révoqué le modèle.</p>
  <div class="card"><div class="row">
   <label>Clinique<select id="gC">${S.names.map(n=>`<option>${n}</option>`).join("")}</select></label>
   <label>Patient<input id="gP" value="patient-42" style="width:140px"></label>
   <label>Cas n°<input id="gS" type="number" value="0" min="0" max="999" style="width:80px"></label>
   <label>Modèle chargé<select id="gM"><option value="certified">Modèle de la fédération</option><option value="outsider">Modèle entraîné hors fédération</option></select></label>
   <button class="primary" id="gGo">Diagnostiquer</button></div>
   <p class="note" style="margin:10px 0 0">Les identifiants patients ne quittent jamais la clinique : seul un pseudonyme (HMAC) est inscrit.</p></div>${out}`;
  $("#gGo").onclick=e=>act(e.currentTarget,async()=>{const j=await api("/api/diagnose",{clinic:$("#gC").value,patient:$("#gP").value,sample:+$("#gS").value,model:$("#gM").value});S=j.state;diagState={result:j,verify:null};render()});
  const id=R&&!R.refused?R.decision_id:null;
  if(id){
    $("#dVer").onclick=e=>act(e.currentTarget,async()=>{diagState.verify=await api("/api/explanation/verify",{id});render()});
    $("#dTam").onclick=e=>act(e.currentTarget,async()=>{S=await api("/api/explanation/tamper",{id});diagState.verify=await api("/api/explanation/verify",{id});render()});
    $("#dRes").onclick=e=>act(e.currentTarget,async()=>{S=await api("/api/explanation/restore",{id});diagState.verify=await api("/api/explanation/verify",{id});render()});
    $("#dProv").onclick=()=>{tab="prov";loadProv(id)};
  }
}

/* ---------- scénarios ---------- */
const SC=[[1,"Nominal","3 cliniques, 5 rounds, un diagnostic ancré avec modèle et explication, provenance complète."],[2,"Explication falsifiée","Le texte de l'explication est modifié après coup : l'empreinte recalculée trahit la retouche."],[3,"Modèle non certifié","Un modèle entraîné hors fédération remplace le modèle déployé : la porte le refuse."],[4,"Clinique malveillante","5 cliniques, 1 empoisonne ses mises à jour : écartée et rejet ancré ; comparée à la moyenne simple."],[5,"Indisponibilité et audit","Le registre s'arrête pendant un round : file de reprise sans perte, puis audit complet."]];
function rSc(){
  $("#t-sc").innerHTML=`<h2>Scénarios de démonstration</h2><p class="lead">Les cinq scénarios du sujet, exécutés pour de vrai sur le prototype. Après un scénario, explorez l'état résultant dans les autres onglets.</p>
  <div class="grid two">${SC.map(([n,t,d])=>{const r=scLogs[n];return `<div class="card sc"><h4>${n}. ${t}</h4><div class="note">${d}</div><div><button class="primary" data-n="${n}">Exécuter</button></div><div class="console" id="c${n}">${r?r.log.map(l=>`<div class="${l.t}">${esc(l.msg)}</div>`).join(""):'<div class="info">En attente d\'exécution…</div>'}</div>${r?`<div class="verdict ${r.pass?"ok":"bad"}">${r.pass?"✔ Scénario validé":"✘ Écart constaté"}</div>`:""}</div>`}).join("")}</div>
  <div style="margin-top:14px"><button id="scAll">Tout exécuter</button></div>`;
  document.querySelectorAll("#t-sc button[data-n]").forEach(b=>b.onclick=()=>runSc(+b.dataset.n,b));
  $("#scAll").onclick=async e=>{const b=e.currentTarget;for(const [n] of SC){await runSc(n,null)}toast("Les 5 scénarios ont été exécutés.")};
}
async function runSc(n,btn){
  await act(btn,async()=>{const c=$("#c"+n);c.innerHTML='<div class="info">Exécution…</div>';
    const j=await api("/api/scenario",{n});S=j.state;scLogs[n]=j;
    diagState={result:null,verify:null};provData=null;selBlock=null;
    c.innerHTML="";for(const l of j.log){const d=document.createElement("div");d.className=l.t;d.textContent=l.msg;c.appendChild(d);c.scrollTop=1e9;await new Promise(r=>setTimeout(r,110))}
    render()});
}

/* ---------- mesures ---------- */
async function rBench(){
  if(!BENCH)try{BENCH=await api("/api/bench")}catch(e){BENCH=[]}
  const B=BENCH;
  if(!B.length){$("#t-bench").innerHTML='<h2>Mesures</h2><p class="lead">Aucun résultat : lancez <code>python -m measures.benchmark 5</code>.</p>';return}
  const sizes=[...new Set(B.map(r=>r.params))],colors={A:"var(--muted)",B:"var(--accent)",C:"var(--accent2)"};
  const byte=B.filter(r=>r.config==="C").map(r=>({l:r.params+" param.",v:+r.bytes_per_round_median,t:r.bytes_per_round_median+" octets"}));
  const time=sizes.flatMap(s=>["A","B","C"].map(c=>{const r=B.find(x=>x.params===s&&x.config===c);return {l:c,l2:s+" p.",v:+r.round_s_median*1000,c:colors[c],t:`config ${c} : ${(+r.round_s_median*1000).toFixed(2)} ms/round`}}));
  const prov=B.filter(r=>r.config==="C").map(r=>({l:r.params+" param.",v:+r.provenance_s_median*1e6,t:(+r.provenance_s_median*1e6).toFixed(0)+" µs"}));
  $("#t-bench").innerHTML=`<h2>Mesures</h2><p class="lead">Issues de <code>measures/results.csv</code> (médiane sur 5 répétitions, 10 rounds, registre local).</p>
  <div class="grid two"><div class="card"><h3 style="margin-top:0">Octets écrits par round (config C)</h3>${barChart(byte,{fmt:v=>Math.round(v)})}<p class="note">Presque constant quand le modèle passe de 9 à 8 193 paramètres : on n'écrit que des empreintes.</p></div>
  <div class="card"><h3 style="margin-top:0">Durée d'un round (ms)</h3>${barChart(time,{fmt:v=>v.toFixed(1)})}<div class="legend"><span><i style="background:var(--muted)"></i>A fédération seule</span><span><i style="background:var(--accent)"></i>B modèles</span><span><i style="background:var(--accent2)"></i>C contributions + porte</span></div><p class="note">Le surcoût ici inclut des écritures fichier et SQLite : il ne préjuge pas des performances de Fabric.</p></div>
  <div class="card"><h3 style="margin-top:0">Temps de reconstitution d'une provenance (µs)</h3>${barChart(prov,{fmt:v=>Math.round(v)})}</div></div>`;
}

refresh().catch(e=>toast("Serveur injoignable : "+e.message,true));
</script>
</body>
</html>
